# dsh-web-search-switch — bundle patch: mount the provider pack.
#
# The row is host-plane: it registers one web-search provider per third-party
# backend on the harness `web` seam (`ctx.web`), plus one fetch provider. It
# deliberately does NOT change `web.searchProvider` or `web.fetchProvider`: the
# base bundle keeps its defaults, and the settings page writes the selection
# from the UI.
#
# Providers this row registers:
#   search-ollama   search-tavily   search-brave   search-exa
#   search-serper   search-bocha    search-zhipu   search-searxng
#   fetch-ollama
#
# The official providers (deepseek-official, deepseek-search-api,
# deepseek-fetch-api) and the local fetcher (http) stay owned by their own
# built-in rows; the settings page lists them as selectable targets.

- insert:
    - id: web-search-switch
      name: dsh-web-search-switch
